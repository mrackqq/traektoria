# Проверка каждого изменения.
#
# Порядок шагов — от самого дешёвого к самому дорогому, чтобы очевидная
# поломка обнаруживалась за секунды, а не после семи минут сборки браузера.
#
# Node закреплён на 22: `--experimental-strip-types` и
# `--experimental-test-module-mocks`, на которых держится прогон тестов,
# в более ранних версиях просто отсутствуют.

name: Проверка

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Новый пуш в ту же ветку отменяет предыдущий прогон: проверять
# устаревший коммит незачем.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Типы, линтер, тесты
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Типы
        run: npm run typecheck

      - name: Линтер
        run: npm run lint

      - name: Модульные тесты и пороги покрытия
        run: npm run test:coverage

      - name: Продуктовая сборка
        run: npm run build

  e2e:
    name: Сквозные сценарии
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Гонять браузер, если не сходятся типы или падают модульные тесты,
    # смысла нет: это те же ошибки, только дороже.
    needs: checks

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Браузер для Playwright
        run: npx playwright install --with-deps chromium

      - name: Сквозные сценарии
        run: npm run test:e2e

      - name: Отчёт при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
